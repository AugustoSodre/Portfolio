<section class="hero">
  <div class="id">
    <h1 class="name">{{ c.name }}</h1>
    <p class="role">{{ c.role }}</p>
    <ul class="links mono">
      <li><a [href]="c.links.linkedin" target="_blank" rel="me noopener">LinkedIn<span class="sr-only">{{ c.newTab }}</span></a></li>
      <li><a [href]="c.links.github" target="_blank" rel="me noopener">GitHub<span class="sr-only">{{ c.newTab }}</span></a></li>
    </ul>
  </div>
  <app-menu class="menu" [locale]="locale" variant="full" />
</section>
